services:
  cybermind-demo-web:
    image: alpine:3.20
    command: ["sh", "-lc", "python3 -c 'print(\"CYBERMIND isolated demo sandbox ready\")'"]
    read_only: true
    networks: [cybermind_isolated_net]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
networks:
  cybermind_isolated_net:
    driver: bridge
    internal: true
