seed: 42
data:
  raw_dir: data/raw/CIC-IDS-2018
  # Synthetic Phase 0 fixture; never a real primary training corpus.
  processed_dir: examples/smoke/baseline_before/processed
  window_seconds: 60
  stride_seconds: 60
  history: 8
model:
  graph_hidden: 32
  graph_out: 32
  temporal_dim: 64
  nhead: 4
  temporal_layers: 2
  num_stages: 7
  dropout: 0.10
loss:
  transition: 1.0
  infiltration: 1.0
  stage: 0.5
  calibration: 0.2
train:
  # Phase 0 memory recheck: 5.57 GiB available; use the plan's lower bound.
  num_workers: 8
  epochs: 2
  lr: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  checkpoint: phase0_baseline.pt
  history_path: examples/smoke/baseline_before/train_history.json
eval:
  rollout_steps: 4

