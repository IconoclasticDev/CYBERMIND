seed: 42
data:
  raw_dir: data/stage_expansion/labeled
  processed_dir: data/processed_stage_expansion
  primary_source: CIC-IDS2018
  window_seconds: 60
  stride_seconds: 30
  history: 16
  train_fraction: 0.80
  val_end_fraction: 0.90
  allow_single_class_validation: true
  require_normalization: true
  require_packet_features: true
model:
  use_edge_features: true
  edge_attr_dim: 27
  graph_hidden: 128
  graph_out: 128
  temporal_dim: 128
  graph_heads: 4
  nhead: 4
  temporal_layers: 2
  num_stages: 7
  dropout: 0.25
loss:
  use_crf_stage: false
  transition: 1.0
  future_state: 0.25
  infiltration: 1.0
  stage: 0.5
  stage_class_balance: true
  calibration: 0.2
  graph_consistency: 0.1
train:
  precision: bf16
  require_cuda: true
  epochs: 35
  lr: 0.00008
  weight_decay: 0.002
  grad_clip: 1.0
  checkpoint: stage_expansion/best.pt
  batch_size: 8
  grad_accumulation: 4
  num_workers: 0
  selection_metric: val_f1_stage_band
  selection_f1_tolerance: 0.03
  selection_stage_metric: stage
  selection_threshold: 0.5
  early_stopping_patience: 6
  min_delta: 0.0
  history_path: results/stage_expansion/train_history.json
  metrics_jsonl_path: results/stage_expansion/metrics.jsonl
  status_path: results/stage_expansion/status.json
  checkpoint_every: 0
  epoch_checkpoint_dir: checkpoints/stage_expansion/epochs
eval:
  rollout_steps: 4
  n_rollouts: 8
