seed: 42
data:
  raw_dir: data/real_chunk/labeled
  processed_dir: data/processed_real_chunk_r4_option_c
  primary_source: CIC-IDS2018
  window_seconds: 60
  stride_seconds: 30
  history: 16
  require_normalization: true
  require_packet_features: true
model:
  use_edge_features: true
  edge_attr_dim: 27
  graph_hidden: 128
  graph_out: 128
  temporal_dim: 128
  graph_heads: 4
  nhead: 4
  temporal_layers: 2
  num_stages: 7
  dropout: 0.10
loss:
  use_crf_stage: true
  use_crf_transition_exclusions: true
  crf_stage: 0.5
  transition: 1.0
  infiltration: 1.0
  stage: 0.5
  stage_class_balance: true
  calibration: 0.2
  graph_consistency: 0.1
train:
  precision: bf16
  require_cuda: true
  epochs: 50
  lr: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
  checkpoint: real_chunk_r4/attempt_2/best.pt
  batch_size: 4
  grad_accumulation: 4
  num_workers: 0
  selection_metric: val_f1_stage_band
  selection_f1_tolerance: 0.05
  selection_stage_metric: stage
  selection_threshold: 0.5
  early_stopping_patience: 20
  min_delta: 0.0
  history_path: results/real_chunk_r4/attempt_2/train_history.json
  metrics_jsonl_path: results/real_chunk_r4/attempt_2/metrics.jsonl
  status_path: results/real_chunk_r4/attempt_2/status.json
  checkpoint_every: 1
  epoch_checkpoint_dir: checkpoints/real_chunk_r4/attempt_2/epochs
  collapse_monitor:
    enabled: true
    split: val
    start_epoch: 1
    cadence_epochs: 1
    rollout_steps: 4
    n_rollouts: 4
    seed: 0
    stop_on_collapse: true
eval:
  rollout_steps: 4
  n_rollouts: 4
