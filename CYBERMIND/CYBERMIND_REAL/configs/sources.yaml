# CYBERMIND public-source registry. Large raw datasets are downloaded on the target machine,
# not vendored into this repo. Keep provenance.json next to every downloaded source.
sources:
  cic_ids_2018:
    role: primary_training
    format: flow_csv_and_pcap
    official: https://registry.opendata.aws/cse-cic-ids2018/
    direct_access: s3://cse-cic-ids2018/
    download: aws s3 sync --no-sign-request s3://cse-cic-ids2018/ data/raw/CIC-IDS-2018/
    notes: Seven attack scenarios; 80+ CICFlowMeter traffic features; use PCAP when host identity is needed.
  cic_ids_2017:
    role: cross_dataset_validation
    format: flow_csv_and_pcap
    official: https://www.unb.ca/cic/datasets/ids-2017.html
    download: manual_web_download
    notes: Contains labeled flows with timestamps and endpoint IP/port/protocol fields; scenario-aware validation source.
  unsw_nb15:
    role: cross_dataset_validation
    format: pcap_bro_argus_csv
    official: https://research.unsw.edu.au/projects/unsw-nb15-dataset
    download: manual_web_download
    notes: 9 attack categories; 49 commonly used features; raw PCAP plus CSV/ground-truth resources.
  ctu_13:
    role: cross_dataset_validation
    format: pcap_flow_labels
    official: https://www.stratosphereips.org/datasets
    download: manual_web_download
    notes: 13 botnet scenarios with botnet/C2/normal/background labels.
  ciciot2023:
    role: topology_and_iot_validation
    format: pcap_and_csv
    official: https://www.unb.ca/cic/datasets/iotdataset-2023.html
    download: manual_web_download
    notes: 33 attacks across 7 categories in a 105-device IoT topology; CSV and PCAP directories.
  lanl_auth:
    role: auxiliary_identity_temporal
    format: authentication_event_csv
    official: https://csr.lanl.gov/data/
    download: manual_web_download
    notes: Auxiliary user-host authentication edges; do not pretend auth events are packet flows.
  darpa_1998:
    role: historical_sequence_validation
    format: tcpdump_and_audit_logs
    official: https://www.ll.mit.edu/r-d/datasets/1998-darpa-intrusion-detection-evaluation-dataset
    download: manual_web_download
    notes: Historical intrusion benchmark; use mainly for temporal/sequence robustness, not feature-distribution matching.
  darpa_1999:
    role: historical_sequence_validation
    format: tcpdump_and_audit_logs
    official: https://www.ll.mit.edu/r-d/datasets/1999-darpa-intrusion-detection-evaluation-dataset
    download: manual_web_download
    notes: Historical network and host audit data; keep as a distinct provenance family.
  mitre_attack:
    role: attack_ontology
    format: stix21_json
    official: https://attack.mitre.org/resources/attack-data-and-tools/
    repo: https://github.com/mitre-attack/attack-stix-data
    direct: https://raw.githubusercontent.com/mitre-attack/attack-stix-data/master/enterprise-attack/enterprise-attack.json
    notes: Enterprise ATT&CK STIX 2.1; cache a dated snapshot for reproducibility.
  capec:
    role: attack_pattern_ontology
    format: xml
    official: https://capec.mitre.org/data/downloads
    direct: https://capec.mitre.org/data/archive/capec_latest.zip
    notes: CAPEC attack-pattern catalog; current page reports version 3.9 and 559 attack patterns.
  nvd:
    role: vulnerability_context
    format: json_api
    official: https://nvd.nist.gov/
    api: https://services.nvd.nist.gov/rest/json/cves/2.0
    notes: Use API snapshots/ranges; never bake live NVD calls into the offline inference path.
  nciipc:
    role: india_cii_context_and_contact
    official: https://www.nciipc.gov.in/
    government_directory: https://www.india.gov.in/category/science-it-communication/subcategory/research-development/details/website-of-national-critical-information-infrastructure-protection-centre
    contact: helpdesk1@nciipc.gov.in
    notes: Treat NCIIPC as a contact/resource pathway; ingest only explicitly public/open material and never request operational or sensitive CII data.

