# Cost-minimized first run over the complete official CIC-IDS2018 flow corpus.
# The official flow CSVs do not contain CYBERMIND's derived packet fields, so this
# run records that limitation rather than claiming packet-complete training.
seed: 42
data:
  raw_dir: data/raw/CIC-IDS-2018
  processed_dir: data/processed_gb10_economy
  primary_source: CIC-IDS2018
  window_seconds: 60
  stride_seconds: 30
  history: 8
  require_normalization: true
  require_packet_features: false
model:
  use_edge_features: true
  edge_attr_dim: 27
  graph_hidden: 128
  graph_out: 128
  temporal_dim: 128
  graph_heads: 4
  nhead: 4
  temporal_layers: 2
  num_stages: 7
  dropout: 0.10
loss:
  use_crf_stage: true
  crf_stage: 0.5
  transition: 1.0
  infiltration: 1.0
  stage: 0.5
  calibration: 0.2
  graph_consistency: 0.1
train:
  precision: bf16
  require_cuda: true
  epochs: 50
  lr: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
  checkpoint: best_gb10_economy.pt
  batch_size: 8
  grad_accumulation: 4
  num_workers: 0
  selection_metric: val_f1_stage_band
  selection_f1_tolerance: 0.05
  selection_stage_metric: stage
  selection_threshold: 0.5
  early_stopping_patience: 8
  min_delta: 0.0
  history_path: results/gb10_economy_train_history.json
eval:
  rollout_steps: 4
  n_rollouts: 4
