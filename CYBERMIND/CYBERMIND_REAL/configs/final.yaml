seed: 42
data:
  raw_dir: data/raw/CIC-IDS-2018
  processed_dir: data/processed
  window_seconds: 60
  stride_seconds: 30
  history: 16
model:
  graph_hidden: 128
  graph_out: 128
  temporal_dim: 256
  nhead: 8
  temporal_layers: 4
  num_stages: 7
  dropout: 0.10
loss:
  transition: 1.0
  infiltration: 1.0
  stage: 0.5
  calibration: 0.2
train:
  epochs: 50
  lr: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
  checkpoint: best.pt
eval:
  rollout_steps: 8

