services:
  cybermind:
    image: cybermind/offline-app:2026-09-29
    pull_policy: never
    build:
      context: ./integrations/cybermind_deep_merged_2026-09-29
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - cybermind_data:/app/data
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  incident-decrypter:
    image: cybermind/offline-decrypter:2026-09-29
    pull_policy: never
    build:
      context: ./integrations/cybermind_deep_merged_2026-09-29/tools/incident_decrypter
    ports:
      - "127.0.0.1:8001:80"
    restart: unless-stopped
volumes:
  cybermind_data:

