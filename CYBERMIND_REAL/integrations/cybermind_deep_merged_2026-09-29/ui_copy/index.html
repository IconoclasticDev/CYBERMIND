<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBERMIND — Standalone UI Prototypes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #060911;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col bg-[#060911] text-slate-200 select-none">

  <!-- MASTER LAUNCHPAD HEADER -->
  <header class="w-full bg-[#0B101D] border-b border-[#1E293B] px-5 py-2.5 flex items-center justify-between z-20 shrink-0">
    <!-- Branding & Mode Switcher -->
    <div class="flex items-center gap-6">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white font-black text-sm shadow-md shadow-blue-500/20">
          C
        </div>
        <div>
          <span class="text-sm font-bold tracking-tight text-white flex items-center gap-1.5">
            CYBERMIND <span class="text-[9px] font-mono uppercase bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded-full font-bold">STANDALONE COPY</span>
          </span>
          <span class="text-[10px] text-slate-400 block -mt-0.5">Separate HTML/CSS/JS copy · Main app untouched</span>
        </div>
      </div>

      <!-- UI Switcher Tabs -->
      <nav class="flex items-center bg-[#070B14] p-1 rounded-xl border border-[#1E293B]/80 text-xs font-semibold">
        <button id="tabSoc" onclick="switchView('soc')" class="px-3.5 py-1.5 rounded-lg flex items-center gap-2 transition-all bg-blue-600 text-white shadow-sm shadow-blue-500/30">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
          <span>UI 1: Modern SOC Threat Ops</span>
        </button>

        <button id="tabSandbox" onclick="switchView('sandbox')" class="px-3.5 py-1.5 rounded-lg flex items-center gap-2 transition-all text-slate-400 hover:text-white">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          <span>UI 2: Hyper-Sandbox Array</span>
        </button>

        <button id="tabAttackLab" onclick="switchView('attacklab')" class="px-3.5 py-1.5 rounded-lg flex items-center gap-2 transition-all text-red-400 hover:text-white bg-red-950/20 border border-red-800/40">
          <svg class="w-3.5 h-3.5 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          <span class="font-bold">UI 3: Attack Labs &amp; Strix (Ollama 1-Click Patch)</span>
        </button>
      </nav>
    </div>

    <!-- Central Action Buttons: Real Test Cases -->
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2 bg-[#070B14] p-1 rounded-xl border border-[#1E293B]/80 text-xs">
        <span class="text-[10px] text-slate-400 uppercase font-mono px-2 font-bold tracking-wider">Test Cases:</span>
        <button onclick="loadTestCaseMaster('botnet_ares')" class="px-3 py-1 rounded-lg font-bold text-[11px] bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 transition-all flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse"></span>
          <span>Load Botnet Ares (4.5MB)</span>
        </button>

        <button onclick="loadTestCaseMaster('ssh_bruteforce')" class="px-3 py-1 rounded-lg font-bold text-[11px] bg-orange-500/10 hover:bg-orange-500/20 text-orange-400 border border-orange-500/20 transition-all flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-orange-500 animate-pulse"></span>
          <span>Load SSH Brute Force (4.5MB)</span>
        </button>

        <button onclick="resetMaster()" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 transition-all" title="Reset State">
          Reset
        </button>
      </div>

      <!-- Open in New Tab -->
      <a id="btnPopout" href="soc_threats.html" target="_blank" class="p-2 rounded-xl bg-[#141C2E] hover:bg-[#1C273F] border border-[#22304C] text-slate-300 hover:text-white transition-all text-xs flex items-center gap-1.5 font-medium" title="Open active view full window">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
        <span class="hidden md:inline">Open Standalone</span>
      </a>
    </div>
  </header>

  <!-- IFRAME CONTAINER -->
  <main class="flex-1 w-full h-[calc(100vh-53px)] bg-[#060911] relative overflow-hidden">
    <iframe id="viewFrame" src="soc_threats.html" class="w-full h-full border-0"></iframe>
  </main>

  <script>
    let currentView = 'soc';

    function switchView(view) {
      currentView = view;
      const frame = document.getElementById('viewFrame');
      const tabSoc = document.getElementById('tabSoc');
      const tabSandbox = document.getElementById('tabSandbox');
      const tabAttackLab = document.getElementById('tabAttackLab');
      const popout = document.getElementById('btnPopout');

      // Reset tabs
      tabSoc.className = "px-3.5 py-1.5 rounded-lg flex items-center gap-2 transition-all text-slate-400 hover:text-white";
      tabSandbox.className = "px-3.5 py-1.5 rounded-lg flex items-center gap-2 transition-all text-slate-400 hover:text-white";
      tabAttackLab.className = "px-3.5 py-1.5 rounded-lg flex items-center gap-2 transition-all text-slate-400 hover:text-white";

      if (view === 'soc') {
        frame.src = 'soc_threats.html';
        popout.href = 'soc_threats.html';
        tabSoc.className = "px-3.5 py-1.5 rounded-lg flex items-center gap-2 transition-all bg-blue-600 text-white shadow-sm shadow-blue-500/30";
      } else if (view === 'sandbox') {
        frame.src = 'hyper_sandbox.html';
        popout.href = 'hyper_sandbox.html';
        tabSandbox.className = "px-3.5 py-1.5 rounded-lg flex items-center gap-2 transition-all bg-cyan-600 text-white shadow-sm shadow-cyan-500/30";
      } else if (view === 'attacklab') {
        frame.src = 'attack_labs.html';
        popout.href = 'attack_labs.html';
        tabAttackLab.className = "px-3.5 py-1.5 rounded-lg flex items-center gap-2 transition-all bg-gradient-to-r from-red-600 to-rose-600 text-white shadow-sm shadow-red-500/30 font-bold";
      }
    }

    async function loadTestCaseMaster(id) {
      try {
        const res = await fetch('/api/testcases/load', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ testcase_id: id, limit: 1500, clear_previous: true })
        });
        const data = await res.json();
        
        // Notify frame if supported
        const frame = document.getElementById('viewFrame');
        if (frame.contentWindow && frame.contentWindow.loadTestCase) {
          frame.contentWindow.loadTestCase(id);
        } else if (frame.contentWindow && frame.contentWindow.loadTest) {
          frame.contentWindow.loadTest(id);
        }
        alert('Test Case ' + data.name + ' ingested into temporal engine (' + data.accepted + ' flows). Predictive horizon: ' + (data.forecast?.horizon?.stage || 'LATERAL'));
      } catch (e) {
        console.error(e);
      }
    }

    async function resetMaster() {
      await fetch('/api/scenarios/reset', { method: 'POST' });
      const frame = document.getElementById('viewFrame');
      frame.contentWindow.location.reload();
    }
  </script>
</body>
</html>
