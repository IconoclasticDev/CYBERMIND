[program:cybermind_extended]
environment=PROC_NAME="%(program_name)s",CYBERMIND_TARGET_EPOCHS="50"
command=/opt/supervisor-scripts/cybermind-extended.sh
directory=/workspace/cybermind/CYBERMIND_REAL
autostart=true
autorestart=unexpected
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0
