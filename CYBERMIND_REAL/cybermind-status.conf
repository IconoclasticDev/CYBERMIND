[program:cybermind_status]
environment=PROC_NAME="%(program_name)s",CYBERMIND_STATUS_INTERVAL="900"
command=/opt/supervisor-scripts/cybermind-status.sh
directory=/workspace/cybermind/CYBERMIND_REAL
autostart=true
autorestart=unexpected
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0
