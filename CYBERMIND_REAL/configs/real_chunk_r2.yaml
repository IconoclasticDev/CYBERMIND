seed: 42
data:
  raw_dir: data/real_chunk/labeled
  processed_dir: data/processed_real_chunk_r2
  primary_source: CIC-IDS2018
  window_seconds: 60
  stride_seconds: 30
  history: 16
  require_normalization: true
  require_packet_features: true
model:
  use_edge_features: true
  edge_attr_dim: 27
  graph_hidden: 128
  graph_out: 128
  temporal_dim: 128
  graph_heads: 4
  nhead: 4
  temporal_layers: 2
  num_stages: 7
  dropout: 0.10
loss:
  use_crf_stage: true
  crf_stage: 0.5
  transition: 1.0
  infiltration: 1.0
  stage: 0.5
  calibration: 0.2
  graph_consistency: 0.1
train:
  precision: fp32
  require_cuda: false
  epochs: 1
  lr: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
  checkpoint: data/processed_real_chunk_r2/not_used.pt
  batch_size: 1
  grad_accumulation: 1
  num_workers: 0
eval:
  rollout_steps: 4
  n_rollouts: 1
