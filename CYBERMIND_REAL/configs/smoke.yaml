seed: 42
data:
  raw_dir: data/raw/CIC-IDS-2018
  processed_dir: data/processed
  window_seconds: 60
  stride_seconds: 60
  history: 8
model:
  graph_hidden: 32
  graph_out: 32
  temporal_dim: 64
  nhead: 4
  temporal_layers: 2
  num_stages: 7
  dropout: 0.10
loss:
  transition: 1.0
  infiltration: 1.0
  stage: 0.5
  calibration: 0.2
train:
  epochs: 2
  lr: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  checkpoint: smoke.pt
eval:
  rollout_steps: 4

