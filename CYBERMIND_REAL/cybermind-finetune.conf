[program:cybermind_finetune]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/cybermind-finetune.sh
directory=/workspace/cybermind/CYBERMIND_REAL
autostart=false
autorestart=unexpected
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0
