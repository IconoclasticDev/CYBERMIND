data:
  history: 16
  processed_dir: data/recheck_synthetic
  raw_dir: data/raw/CIC-IDS-2018
  stride_seconds: 30
  window_seconds: 60
eval:
  rollout_steps: 8
loss:
  calibration: 0.2
  infiltration: 1.0
  stage: 0.5
  transition: 1.0
model:
  dropout: 0.1
  graph_hidden: 256
  graph_out: 256
  nhead: 8
  num_stages: 4
  temporal_dim: 512
  temporal_layers: 6
seed: 42
train:
  batch_size: 8
  checkpoint: recheck_synthetic.pt
  epochs: 50
  grad_accumulation: 2
  grad_clip: 1.0
  lr: 0.0003
  num_workers: 4
  warmup_epochs: 2
  weight_decay: 0.0001
